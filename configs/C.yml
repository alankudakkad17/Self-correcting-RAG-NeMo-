# System C: B + Planner. Sub-questions -> hybrid retrieval per query -> one cited draft. No verification.
# Note: C also switches generation from the plain answer prompt (A/B) to the cited Researcher prompt,
# so that C vs D isolates the Verifier + Controller loop.
base: llm.yml

functions:
  retriever:
    _type: corpus_retriever
    embedder_name: corpus_embedder
    mode: hybrid
    reranker: hosted
    top_k: 5
    candidates: 50
    rerank_pool: 30
  planner:
    _type: planner
    llm_name: generator
  researcher:
    _type: researcher
    llm_name: generator

workflow:
  _type: self_correcting_workflow
  retriever: retriever
  planner: planner
  researcher: researcher
  per_query_k: 5
  max_evidence: 10
  system_id: C
