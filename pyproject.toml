[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-correcting-rag"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
# Dependencies are pinned in requirements.txt; install that first, then `pip install -e . --no-deps`.
dependencies = []

# NeMo Agent Toolkit discovers plugins through this entry-point group (nat/runtime/loader.py).
[project.entry-points."nat.components"]
self_correcting_rag = "src.register"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
