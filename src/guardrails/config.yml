# NeMo Guardrails rail set (Colang 1.0), for reference. No main LLM: Guardrails runs only our rails, never generates.
# At runtime src/guardrails/rails.py builds one LLMRails per stage from that stage's .co file
# (input.co, retrieval.co, output.co, abstention.co) and the rails switched on in configs/system.yml.
#
# The retrieval rail runs as an output flow on each passage: in nemoguardrails 0.24.1 real retrieval rails only
# fire inside Guardrails' own knowledge-base loop (verified: a standalone call skips them).
colang_version: "1.0"
models: []

rails:
  input:
    flows:
      - check prompt injection
      - check off topic
      - check unsafe request
  output:
    flows:
      - sanitize passage
      - check groundedness
      - check citation format
      - redact pii
      - abstention response
